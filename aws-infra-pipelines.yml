trigger:
  branches:
    include:
      - main

pool:
  name: SelfHostedPool

stages:
  - stage: terraform_plan
    displayName: Terraform Plan

    jobs:
      - job: plan_job
        displayName: Terraform Plan Job

        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: "1.9.8"

          - task: AWSShellScript@1
            displayName: Terraform Init and Plan
            inputs:
              awsCredentials: "aws-connection"
              regionName: "us-east-1"
              scriptType: "inline"
              inlineScript: |
                cd $(System.DefaultWorkingDirectory)
                terraform init
                terraform plan -out=tfplan \
                  -var="db_password=$DB_PASSWORD" \
                  -var="db_username=$DB_USERNAME" \
                  -var="instance_type=$INSTANCE_TYPE" \
                  -var="region=$REGION" \
                  -var="vpc_cidr=$VPC_CIDR" \
                  -var="public_subnet_cidr=$PUBLIC_SUBNET_CIDR" \
                  -var="private_subnet_1_cidr=$PRIVATE_SUBNET_1_CIDR" \
                  -var="private_subnet_2_cidr=$PRIVATE_SUBNET_2_CIDR"
            env:
              DB_PASSWORD: $(TF_VAR_db_password)
              DB_USERNAME: $(TF_VAR_db_username)
              INSTANCE_TYPE: $(TF_VAR_instance_type)
              REGION: $(TF_VAR_region)
              VPC_CIDR: $(TF_VAR_vpc_cidr)
              PUBLIC_SUBNET_CIDR: $(TF_VAR_public_subnet_cidr)
              PRIVATE_SUBNET_1_CIDR: $(TF_VAR_private_subnet_1_cidr)
              PRIVATE_SUBNET_2_CIDR: $(TF_VAR_private_subnet_2_cidr)

          - task: PublishPipelineArtifact@1
            displayName: Publish Plan Artifact
            inputs:
              targetPath: "$(System.DefaultWorkingDirectory)/tfplan"
              artifact: "tfplan"

  - stage: terraform_apply
    displayName: Terraform Apply
    dependsOn: terraform_plan

    jobs:
      - deployment: apply_job
        displayName: Terraform Apply Job
        environment: "production"

        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: "1.9.8"

                - task: AWSShellScript@1
                  displayName: Terraform Apply
                  inputs:
                    awsCredentials: "aws-connection"
                    regionName: "us-east-1"
                    scriptType: "inline"
                    inlineScript: |
                      cd $(Pipeline.Workspace)/s
                      terraform init
                      terraform apply $(Pipeline.Workspace)/tfplan/tfplan

                - task: AWSShellScript@1
                  displayName: Terraform Outputs
                  inputs:
                    awsCredentials: "aws-connection"
                    regionName: "us-east-1"
                    scriptType: "inline"
                    inlineScript: |
                      cd $(Pipeline.Workspace)/s

                      echo "============================================"
                      echo "        INFRASTRUCTURE OUTPUTS"
                      echo "============================================"

                      EC2_IP=$(terraform output -raw ec2_public_ip)
                      RDS_ENDPOINT=$(terraform output -raw rds_endpoint)

                      echo "EC2 Public IP   : $EC2_IP"
                      echo "RDS Endpoint    : $RDS_ENDPOINT"
                      echo "============================================"

                      cat > $(Pipeline.Workspace)/s/inventory.ini << EOF
                      [web]
                      $EC2_IP

                      [web:vars]
                      ansible_user=ubuntu
                      ansible_ssh_private_key_file=~/.ssh/epicbook-key.pem
                      ansible_connection=ssh
                      ansible_ssh_common_args='-o StrictHostKeyChecking=no'
                      ansible_python_interpreter=/usr/bin/python3
                      rds_endpoint=$RDS_ENDPOINT
                      EOF

                      echo "Updated inventory.ini:"
                      cat $(Pipeline.Workspace)/s/inventory.ini

                - task: PublishPipelineArtifact@1
                  displayName: Publish Updated Inventory
                  inputs:
                    targetPath: "$(Pipeline.Workspace)/s/inventory.ini"
                    artifact: "inventory"
